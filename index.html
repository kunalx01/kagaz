<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a56c4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="कागदपत्रे">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>कागदपत्रे</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Devanagari','Mukta','Mangal',sans-serif;background:#e5e7eb;color:#000}
.ui{font-family:inherit}
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
#top{overflow-x:auto;position:fixed;top:0;left:0;right:0;height:calc(56px + var(--st));display:flex;gap:6px;padding:calc(6px + var(--st)) 6px 6px;background:#fff;border-bottom:1px solid #ccc;z-index:5}
#top button{flex:1 0 auto;padding:0 10px;font:700 16px inherit;font-family:inherit;border:2px solid #1a56c4;background:#fff;color:#1a56c4;border-radius:10px}
#top button.on{background:#1a56c4;color:#fff}
#bot{position:fixed;bottom:0;left:0;right:0;height:calc(64px + var(--sb));display:flex;gap:6px;padding:6px 6px calc(6px + var(--sb));background:#fff;border-top:1px solid #ccc;z-index:5}
#bot button{font:700 14px inherit;font-family:inherit;border:0;border-radius:10px;color:#fff;background:#444;padding:0 6px}
#bot .z{width:42px;font-size:26px;line-height:1}
#bot .d{width:44px;font-size:20px;background:#5b3ea6}
#bot .p{flex:1;background:#1a56c4}
#bot .w{flex:1.6;background:#128c4a}
#bot .c{background:#b3261e;font-size:13px;padding:0 8px}
#sc{position:fixed;top:calc(56px + var(--st));bottom:calc(64px + var(--sb));left:0;right:0;overflow:auto;padding:6px}
.page{display:none;width:210mm;min-height:297mm;margin:0 auto;padding:25.4mm;background:#fff;box-shadow:0 1px 6px #0004;font-size:11.5pt;line-height:1.5}
.page.on{display:block}
.f{background:#fffbe0;outline:none;white-space:pre-wrap;word-break:break-word;caret-color:#d00}
.f:focus{background:#fff1a8;box-shadow:0 0 0 2px #1a56c4}
span.f{display:inline-block;min-width:2em;vertical-align:baseline;border-bottom:1px dotted #555}
div.f{display:block;min-height:1.6em}
h1{font-size:15pt;text-align:center;margin:0 0 2px}
.cen{text-align:center;font-weight:700;margin:2px 0}
h3{font-size:11.5pt;margin:10px 0 3px;break-after:avoid}
table.t{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:-1px}
.t td,.t th{border:1px solid #000;padding:3px 5px;vertical-align:top;word-break:break-word}
.t th{text-align:center;font-weight:700;font-size:10.5pt;line-height:1.35;padding:3px 3px}
.t tr{break-inside:avoid}
.t td.n{text-align:center;width:9%}
.ct tbody{counter-reset:r}
.ct tbody tr{counter-increment:r}
.ct td.n::before{content:counter(r,devanagari)}
.rc{display:flex;gap:10px;justify-content:flex-end;margin:6px 0 8px}
.rc button{font:700 15px inherit;font-family:inherit;padding:8px 12px;border:2px solid #1a56c4;background:#fff;color:#1a56c4;border-radius:8px}
.cb{display:inline-block;width:1.1em;height:1.1em;border:1.5px solid #000;vertical-align:-0.15em;margin:0 3px 0 10px;text-align:center;line-height:1em;font-size:1em;cursor:pointer}
.cb.on::after{content:"✔";font-size:.95em}
.lb{padding-left:2.5em;text-indent:-2.5em}
.ix{display:inline-block;width:2.5em;text-indent:0}
.sign{height:24mm}
.l{font-weight:400}
.letter{min-height:230mm;font-size:13pt;line-height:1.8}
#msg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#msg div{background:#fff;padding:22px;border-radius:14px;text-align:center;font-size:18px;max-width:85%}
#msg button{margin-top:14px;font:700 18px inherit;font-family:inherit;padding:12px 20px;border:0;border-radius:10px;background:#128c4a;color:#fff}
#dm{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#dm .bx{background:#fff;padding:18px;border-radius:14px;width:88%;max-width:380px;display:flex;flex-direction:column;gap:10px;font-size:16px}
#dm h2{margin:0;font-size:18px}
#dm small{color:#555;line-height:1.4}
#dm button{font:700 16px inherit;font-family:inherit;padding:12px;border:0;border-radius:10px;background:#1a56c4;color:#fff}
#dm button.g{background:#128c4a}#dm button.x{background:#e5e7eb;color:#000}
#dm button[hidden]{display:none}
#b td:nth-child(2){white-space:nowrap}
#b tr.h1 td,#b tr.h2 td{white-space:normal}
@page{size:A4;margin:25.4mm}
@media print{
 body{background:#fff}
 .ui,#top,#bot,#msg,#dm{display:none!important}
 #sc{position:static;padding:0;overflow:visible}
 #wrap{zoom:1!important}
 .page{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
 .f{background:none!important;box-shadow:none!important}
 .nb td{border-color:#fff}
 tr.h1 td{border-color:#fff}
 tr.h2 td{border-color:#fff #fff #000 #fff}
 span.f{border-bottom:0}
 .bxo{border-color:#fff!important}
}
.out .nb td{border-color:#fff}
.out .bxo{border-color:#fff!important}
.out tr.h1 td{border-color:#fff}
.out tr.h2 td{border-color:#fff #fff #000 #fff}
</style>
</head>
<body>
<div id="top" class="ui">
 <button data-p="a" class="on">दोषारोप पत्र</button>
 <button data-p="b">केस डायरी</button>
 <button data-p="c">पत्र</button>
 <button data-p="d">कोरे पत्र</button>
 <button data-p="e">फेरिस्त</button>
</div>
<div id="sc"><div id="wrap">
 <div class="page on" id="a"></div>
 <div class="page" id="b"></div>
 <div class="page" id="c"></div>
 <div class="page" id="d"></div>
 <div class="page" id="e"></div>
</div></div>
<div id="bot" class="ui">
 <button class="z" id="zo">−</button>
 <button class="z" id="zi">+</button>
 <button class="p" id="pr">प्रिंट</button>
 <button class="w" id="sh">PDF पाठवा</button>
 <button class="d" id="db" aria-label="बॅकअप">💾</button>
 <button class="c" id="cl">पुसा</button>
</div>
<div id="dm"><div class="bx">
 <h2>माहिती व बॅकअप</h2>
 <small id="ds"></small>
 <button id="bk">बॅकअप जतन करा (.txt)</button>
 <button id="bs" class="g" hidden>बॅकअप शेअर करा</button>
 <button id="br">बॅकअप परत आणा (.txt)</button>
 <button id="bi" class="g" hidden>ॲप इन्स्टॉल करा</button>
 <button id="bc" class="x">बंद करा</button>
 <input type="file" id="bf" accept=".txt,.json,text/plain" hidden>
</div></div>
<div id="msg"><div><span id="mt"></span><br><button id="mb" style="display:none">शेअर करा</button></div></div>

<script src="html2pdf.bundle.min.js"></script>
<script>
const E='contenteditable="plaintext-only"';
const f=(w=2.2)=>`<span class="f" ${E} style="min-width:${w}em"></span>`;
const dt=`${f()} / ${f()} / २०२६`;
const B=(h=1.6,v='')=>`<div class="f" ${E} style="min-height:${h}em">${v}</div>`;
const cb=t=>`<span class="cb"></span>${t}`;
const R=n=>`<tr><td class="n"></td>${`<td class="f" ${E}></td>`.repeat(n-1)}</tr>`;
const T=(h,w)=>`<table class="t ct"><colgroup>${w.map(x=>`<col style="width:${x}%">`).join('')}</colgroup><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${R(h.length)}</tbody></table><div class="rc ui"><button data-a="rem">− ओळ कमी करा</button><button data-a="add">+ ओळ वाढवा</button></div>`;
const lb=l=>{if(l[0]==='(')return `<div class="lb"><span class="ix"></span>${l}</div>`;const m=l.match(/^(\S+[.)])\s+(.*)$/);return m?`<div class="lb"><span class="ix">${m[1]}</span>${m[2]}</div>`:l};
const kv=(l,v,c=3)=>`<tr><td>${lb(l)}</td><td colspan="${c}">${v}</td></tr>`;
const box=(h)=>`<table class="t nb"><tr><td>${B(h)}</td></tr></table>`;

document.getElementById('a').innerHTML=`
<h1>दोषारोप पत्र/अंतिम अहवाल</h1>
<div class="cen">(बी. एन. एस. एस. कलम १९३ अन्वये)</div>
<div class="cen" style="margin-bottom:6px">मा. प्रथमवर्ग न्यायदंडाधिकारी सो., प्रथमश्रेणी न्यायालय, धरणगांव यांना सविनय सादर</div>
<table class="t nb"><tr><td>१. जिल्हा :</td><td>जळगांव</td><td>पोलीस ठाणे :</td><td>धरणगांव</td><td>वर्ष :</td><td>२०२६</td></tr></table>
<table class="t nb"><colgroup><col style="width:30%"><col style="width:28%"><col style="width:14%"><col style="width:28%"></colgroup>
<tr><td>${lb('२. पहिली खबर क्रं. / CCTNS No. :')}</td><td>${B()}</td><td>दिनांक :</td><td>${dt}</td></tr>
${kv('३. दोषारोप पत्र क्र. :',f(4)+' / २०२६')}
${kv('४. तारीख :',dt+' (दिवस / महिना / वर्ष)')}
${kv('५. (i) अधिनियम :',B())}
${kv('(ii) अधिनियम :',B())}
${kv('(iii) अधिनियम :',B())}
${kv('६. अंतिम अहवालाचा प्रकार :',B())}
${kv('७. जर अंतिम अहवालाचा प्रकार/घडला नाही :',B())}
${kv('८. जर आरोप पत्र ठेवले (मूळ / तात्पुरते / पुरवणी) :',B())}
${kv('९. तपासणी अधिकाऱ्याचे नांव व पदनाम :',B())}
${kv('१०. (i) तक्रारदाराचे/खबरीचे नांव :',B())}
${kv('(ii) पित्याचे/पतीचे नांव :',B())}
</table>
<h3>११) कोर्टात दोषारोप पाठविलेल्या आरोपीतांची यादी/फरारीसह असल्यास</h3>
${T(['अ.क्र.','आरोपीचे संपूर्ण नांव व पत्ता','वय','अटक दिनांक','रिमांड दिनांक','शेरा'],[8,32,7,18,18,17])}
<h3>१२) पडताळलेल्या साक्षीदारांचे विवरण</h3>
${T(['अ.क्र.','साक्षीदाराचे नाव','वय','पत्ता','तपासाचा प्रकार'],[8,30,8,32,22])}
<h3>१३) पहिली खबर खोटी असेल तर भारतीय न्याय संहितेच्या २०२/२३४ अन्वये केलेली किंवा करावयाची कार्यवाही नमूद करावी :</h3>
${box(1.6)}
<table class="t nb" style="margin-top:8px"><colgroup><col style="width:34%"><col style="width:66%"></colgroup><tr><td>${lb('१४) प्रयोगशाळा विश्लेषणाचे निष्कर्ष :')}</td><td>${B(2)}</td></tr></table>
<h3>१५) तपासणीचे वेळी परत मिळविलेल्या / जप्त केलेल्या आणि अवलंबून राहिलेल्या मालमत्तेचा / वस्तूचा तपशील</h3>
<div>(आवश्यक असेल तर स्वतंत्र यादी सोबत जोडण्यात येईल)</div>
${T(['अ.क्र.','मालमत्तेचे वर्णन','मालमत्ता कोणाकडून / कोठून जप्त केली','मूल्य रुपये','नोंदवही क्रमांक','विल्हेवाट'],[8,19,30,13,16,14])}
<h3>१६) प्रकरणाची थोडक्यात माहिती :</h3>
${box(1.6)}
<table class="t nb" style="margin-top:8px"><tr><td>१७) कलम १९३ प्रमाणे सूचना फॉर्म बजावला जावक क्रं. ${f(3)} / २०२६ दि. ${dt}</td></tr></table>
<table class="t nb"><colgroup><col style="width:34%"><col style="width:66%"></colgroup>
<tr><td>${lb('१८) कोर्ट सी.सी. नं. :')}</td><td>${B()}</td></tr>
<tr><td>${lb('१९) कोर्टाचा निकाल :')}</td><td>${B()}</td></tr></table>
<table class="t nb" style="margin-top:8px"><tr><td>${lb('२०) प्रभारी अधिकाऱ्यांची सही :')}</td><td>दोषारोप पत्र सादर करणारे अंमलदार सही</td></tr><tr><td class="sign"></td><td class="sign"></td></tr></table>`;

const row=(n,l,v)=>`<tr><td class="n">${n}</td><td><b>${l}</b></td><td>${v}</td></tr>`;
const labs=['फिर्यादीचे नाव','आरोपीचे नाव','अप.घडता तारीख वेळ','अप.घडला ठिकाण','अपराध दाखल तारीख वेळ','जखमी /पिडीत','वापरलेले हत्यार','जप्त माल','भेट दिल्याचे ठिकाण','तपास सुरु व संपल्याची वेळ','गुरनं व कलम'];
const nums=['४','५','६','७','८','९','१०','११','१२','१३','१४'];
document.getElementById('b').innerHTML=`
<table class="t"><colgroup><col style="width:7%"><col style="width:39%"><col style="width:54%"></colgroup>
<tr class="h1"><td></td><td><b>केसडायरी X</b></td><td><b>मा. डा. नं.</b> ${f(4)}</td></tr>
<tr class="h2"><td></td><td>दि. ${dt}</td><td>दिनांक ${dt}</td></tr>
${row('१','पोलीस ठाणे','धरणगांव')}
${row('२','जिल्हा','जळगांव')}
${row('३','अन्वेषण अधिकारी',B())}
${labs.map((l,i)=>row(nums[i],l,B())).join('')}
${row('१५','केसडायरी','गुरनं. '+f(3)+' /२६ X दि. '+dt)}
</table>
<h3 style="margin-top:12px">तपासाचा खुलासा:-</h3>
<div class="f letter" ${E} style="min-height:120mm;font-size:12pt;line-height:1.7"></div>`;

const bx=(w,h,x='')=>`<div class="f bxo" ${E} style="box-sizing:border-box;border:1px solid #000;padding:3px 6px;width:${w}%;min-height:${h}mm;${x}"></div>`;
const vr=l=>`<table class="t nb" style="width:89.4%;margin:0 0 4mm 10.6%"><colgroup><col style="width:12.7%"><col style="width:87.3%"></colgroup><tr><td style="font-weight:700;height:9mm;vertical-align:top">${l}</td><td class="f" ${E} style="vertical-align:top"></td></tr></table>`;
document.getElementById('c').innerHTML=`<div style="font-size:12pt;line-height:1.6">
<div style="text-align:right;font-weight:700">धरणगाव पोलिस स्टेशन</div>
<div style="text-align:right;font-weight:700">दि. ${f()} / ${f()} / २०२६</div>
<div style="font-weight:700;margin:8mm 0 1mm">प्रति,</div>
${bx(41.2,17.7)}
<div style="height:8mm"></div>
${vr('विषय :')}${vr('रिपोर्ट :')}
<div style="font-weight:700;margin:8mm 0 1mm">महोदय,</div>
${bx(100,20.6)}
<div style="text-align:right;font-weight:700;margin:8mm 0 1mm">मा. सविनय सादर</div>
${bx(25.6,7.9,'margin-left:auto')}
</div>`;

document.getElementById('d').innerHTML=`<div class="f letter" ${E} style="min-height:240mm"></div>`;

document.getElementById('e').innerHTML=`<div style="font-size:13pt;line-height:1.5">
<table class="t nb"><tr><td><div class="fit" style="display:flex;align-items:baseline;white-space:nowrap;font-size:13pt"><span style="flex:none">धरणगाव पोलिस स्टेशन गुन्हा/ अ. मृ. /प्रोव्ही /रजि. नं. /&nbsp;</span><span class="f" ${E} style="flex:none;min-width:2.4em"></span><span style="flex:none">&nbsp;/ २०२</span><span class="f" ${E} style="flex:none;min-width:1.4em"></span></div></td></tr></table>
<table class="t nb"><colgroup><col style="width:13%"><col style="width:31%"><col style="width:56%"></colgroup><tr><td style="white-space:nowrap">कलम :</td><td class="f" ${E}></td><td style="text-align:right;white-space:nowrap">या गुन्ह्याचे कागद पत्राचे फेरिस्त</td></tr></table>
</div>
<div style="height:6mm"></div>
<div style="font-size:12pt">${T(['अ. नु.','कागदातील तपशील','पान संख्या','दिनांक'],[10,52,14,24])}</div>`;

const init={};['a','b','c','d','e'].forEach(i=>init[i]=document.getElementById(i).innerHTML);
const names={a:'दोषारोप पत्र',b:'केस डायरी',c:'पत्र',d:'कोरे पत्र',e:'फेरिस्त'};
let cur='a',z=1;
const wrap=document.getElementById('wrap');
const setZ=v=>{z=Math.max(.3,Math.min(2.2,v));wrap.style.zoom=z};
setZ((innerWidth-14)/794);

document.querySelectorAll('#top button').forEach(b=>b.onclick=()=>{
 cur=b.dataset.p;sched();
 document.querySelectorAll('#top button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===cur));
 document.getElementById('sc').scrollTop=0;
});
zi.onclick=()=>setZ(z+.15);
zo.onclick=()=>setZ(z-.15);
pr.onclick=()=>print();
cl.onclick=()=>{if(confirm('ही सर्व माहिती पुसायची का?')){document.getElementById(cur).innerHTML=init[cur];sched()}};

document.addEventListener('click',e=>{
 const c=e.target.closest('.cb');if(c){c.classList.toggle('on');sched()}
 const b=e.target.closest('.rc button');if(!b)return;
 const tb=b.closest('.rc').previousElementSibling.tBodies[0];
 if(b.dataset.a==='add'){const r=tb.lastElementChild.cloneNode(true);r.querySelectorAll('.f').forEach(x=>x.textContent='');tb.appendChild(r)}
 else if(tb.rows.length>1)tb.lastElementChild.remove();
 sched();
});

const msg=document.getElementById('msg'),mt=document.getElementById('mt'),mb=document.getElementById('mb');
const show=(t,btn)=>{mt.textContent=t;mb.style.display=btn?'inline-block':'none';msg.style.display='flex'};
let file=null;
const doShare=async()=>{
 try{await navigator.share({files:[file]});msg.style.display='none'}
 catch(e){if(e.name==='AbortError')msg.style.display='none';else show('शेअर करता आले नाही. PDF डाउनलोड केला आहे.',false),dl()}
};
const dl=()=>{const u=URL.createObjectURL(file);const a=document.createElement('a');a.href=u;a.download=file.name;a.click()};
mb.onclick=doShare;
msg.onclick=e=>{if(e.target===msg)msg.style.display='none'};

sh.onclick=async()=>{
 show('PDF तयार होत आहे... कृपया थांबा');
 try{
  const el=document.getElementById(cur).cloneNode(true);
  el.className='out';el.style.cssText='width:159.2mm;padding:0;margin:0;background:#fff;font-size:11.5pt;line-height:1.5';
  el.querySelectorAll('.ui').forEach(x=>x.remove());
  el.querySelectorAll('.f').forEach(x=>{x.style.background='none';x.style.boxShadow='none'});
  el.querySelectorAll('span.f').forEach(x=>x.style.borderBottom='0');
  /* Marathi fix: html2canvas splits text between every character when word-break/overflow-wrap is break-word, which breaks Devanagari shaping. Use normal wrapping only in the PDF copy. */
  el.querySelectorAll('*').forEach(x=>{x.style.wordBreak='normal';x.style.overflowWrap='normal'});
  /* Page-break fix: split long free-text boxes into one block per printed line, so a page break can only fall between lines, never through a line. */
  el.style.position='absolute';el.style.left='-9999px';el.style.top='0';document.body.appendChild(el);
  try{
   el.querySelectorAll('div.f').forEach(box=>{
    if(box.closest('table'))return;
    const txt=box.textContent;if(!txt.trim())return;
    box.textContent=txt;const node=box.firstChild;if(!node)return;
    const lines=[];let ps=0;
    txt.split('\n').forEach(par=>{
     const re=/\S+/g;let m,start=ps,top=null,end=ps,any=false;
     while((m=re.exec(par))){
      const a=ps+m.index,b=a+m[0].length,r=document.createRange();r.setStart(node,a);r.setEnd(node,b);
      const rc=r.getClientRects(),t=rc.length?rc[0].top:top;
      if(top!==null&&t-top>3){lines.push(txt.slice(start,end));start=a}
      top=t;end=b;any=true;
     }
     lines.push(any?txt.slice(start,end):'');
     ps+=par.length+1;
    });
    box.textContent='';
    lines.forEach(l=>{const d=document.createElement('div');d.className='ln';d.style.whiteSpace='pre';d.textContent=l===''?'\u00a0':l;box.appendChild(d)});
   });
  }catch(e){}
  el.remove();el.style.position='';el.style.left='';el.style.top='';
  const d=new Date();
  const name=names[cur]+' '+d.getDate()+'-'+(d.getMonth()+1)+'-'+d.getFullYear()+'.pdf';
  const blob=await html2pdf().set({margin:25.4,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4'},pagebreak:{mode:['css','legacy'],avoid:['tr','.ln']}}).from(el).outputPdf('blob');
  file=new File([blob],name,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   try{await navigator.share({files:[file]});msg.style.display='none'}
   catch(e){if(e.name==='AbortError')msg.style.display='none';else show('PDF तयार आहे. खालील बटन दाबा.',true)}
  }else{dl();show('PDF डाउनलोड झाला.')}
 }catch(e){show('PDF बनवता आला नाही. ')}
};

/* ---------- English digits -> Marathi digits ---------- */
const MD='०१२३४५६७८९',toMr=t=>t.replace(/[0-9]/g,d=>MD[d]);
function fixDigits(box){
 const w=document.createTreeWalker(box,NodeFilter.SHOW_TEXT),sel=getSelection();
 let an=null,ao=0;if(sel.rangeCount&&box.contains(sel.anchorNode)){an=sel.anchorNode;ao=sel.anchorOffset}
 let n,ch=false;
 while(n=w.nextNode()){if(/[0-9]/.test(n.data)){n.data=toMr(n.data);ch=true}}
 if(ch&&an&&an.nodeType===3){try{sel.collapse(an,Math.min(ao,an.data.length))}catch(e){}}
}
document.addEventListener('input',e=>{const b=e.target.closest&&e.target.closest('.f');if(b)fixDigits(b)},true);

/* ---------- local storage (autosave), backup as text, install ---------- */
const $=i=>document.getElementById(i),pages=['a','b','c','d','e'];
const K='kagadpatre_v1',BK=K+'_bak',SN=K+'_snap_',LX=K+'_lastexport';
let ok=true,lastSave=0,bakT=0,loaded=false,timer=null,inst=null;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function snap(){
 const o={app:'kagadpatre',v:1,cur,pages:{}};
 pages.forEach(id=>{const p=$(id);o.pages[id]={
  r:[...p.querySelectorAll('table.ct tbody')].map(t=>t.rows.length),
  f:[...p.querySelectorAll('.f')].map(x=>x.textContent),
  c:[...p.querySelectorAll('.cb')].map(x=>x.classList.contains('on')?1:0)}});
 return o;
}
function apply(o){
 pages.forEach(id=>{const s=o.pages&&o.pages[id];if(!s)return;if(id==='c'&&s.f&&s.f.length===1)s.f=['','','','','',s.f[0],''];const p=$(id);p.innerHTML=init[id];
  p.querySelectorAll('table.ct tbody').forEach((tb,i)=>{const n=s.r&&s.r[i]||tb.rows.length;
   while(tb.rows.length<n){const r=tb.lastElementChild.cloneNode(true);r.querySelectorAll('.f').forEach(x=>x.textContent='');tb.appendChild(r)}});
  p.querySelectorAll('.f').forEach((x,i)=>{if(s.f&&typeof s.f[i]==='string')x.textContent=toMr(s.f[i])});
  p.querySelectorAll('.cb').forEach((x,i)=>x.classList.toggle('on',!!(s.c&&s.c[i])));
 });
 if(o.cur&&names[o.cur])showTab(o.cur);
}
const valid=raw=>{try{const o=JSON.parse(raw);if(o&&o.app==='kagadpatre'&&o.pages)return o}catch(e){}return null};
function load(){
 try{
  const keys=[K,BK],sn=[];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(SN)===0)sn.push(k)}
  sn.sort().reverse();
  for(const k of keys.concat(sn)){const raw=localStorage.getItem(k),o=raw&&valid(raw);if(o){apply(o);return}}
 }catch(e){ok=false}
}
function save(){
 if(!loaded)return;
 try{
  const raw=JSON.stringify(snap()),prev=localStorage.getItem(K);
  if(prev&&prev!==raw&&Date.now()-bakT>600000){localStorage.setItem(BK,prev);bakT=Date.now()}
  localStorage.setItem(K,raw);
  const sk=SN+today();
  if(!localStorage.getItem(sk)){
   localStorage.setItem(sk,raw);
   const all=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(SN)===0)all.push(k)}
   all.sort();while(all.length>7)localStorage.removeItem(all.shift());
  }
  ok=true;lastSave=Date.now();
 }catch(e){ok=false}
 db.style.background=ok?'':'#b3261e';
}
function sched(){clearTimeout(timer);timer=setTimeout(save,400)}
document.addEventListener('input',sched);
addEventListener('pagehide',()=>{clearTimeout(timer);save()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(timer);save()}});

function showTab(id){
 cur=id;
 document.querySelectorAll('#top button').forEach(x=>x.classList.toggle('on',x.dataset.p===id));
 document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id));
}

/* backup dialog */
const dm=$('dm'),ds=$('ds'),bf=$('bf');
function dstat(){
 const t=lastSave?new Date(lastSave).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
 const lx=+localStorage.getItem(LX)||0;
 ds.textContent=(ok?'✔ माहिती आपोआप या फोनमध्ये जतन होते'+(t?' ('+t+')':''):'⚠ ब्राउझर स्टोरेज बंद आहे, माहिती जतन होत नाही!')
  +'\nशेवटचा बॅकअप: '+(lx?new Date(lx).toLocaleDateString('en-GB'):'अजून नाही')
  +'\nआठवड्यातून एकदा बॅकअप जतन करा.'
  +'\nॲप आवृत्ती: v8';
 ds.style.whiteSpace='pre-line';
}
function backupFile(){
 const o=snap();o.saved=new Date().toISOString();
 const d=new Date(),name='kagadpatre-backup-'+today()+'.txt';
 return new File([JSON.stringify(o)],name,{type:'text/plain'});
}
db.onclick=()=>{save();dstat();$('bs').hidden=!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.txt',{type:'text/plain'})]}));$('bi').hidden=!inst;dm.style.display='flex'};
$('bc').onclick=()=>dm.style.display='none';
dm.onclick=e=>{if(e.target===dm)dm.style.display='none'};
$('bk').onclick=()=>{
 const f=backupFile(),u=URL.createObjectURL(f),a=document.createElement('a');
 a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),4000);
 localStorage.setItem(LX,Date.now());dstat();
};
$('bs').onclick=async()=>{
 try{await navigator.share({files:[backupFile()]});localStorage.setItem(LX,Date.now());dstat()}catch(e){}
};
$('br').onclick=()=>bf.click();
bf.onchange=async()=>{
 const f=bf.files[0];bf.value='';if(!f)return;
 const o=valid(await f.text());
 if(!o){alert('ही फाइल बरोबर बॅकअप नाही.');return}
 if(!confirm('सध्याची सर्व माहिती बदलून या बॅकअपमधील माहिती येईल. चालेल?'))return;
 apply(o);save();dstat();dm.style.display='none';
};

/* install + offline */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();inst=e});
$('bi').onclick=async()=>{if(inst){inst.prompt();await inst.userChoice;inst=null;$('bi').hidden=true}};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* first line of फेरिस्त: if the phone's font is wider, shrink that line a little so nothing overlaps */
function fitLine(){
 const p=document.getElementById('e');if(!p||!p.offsetWidth)return;
 p.querySelectorAll('.fit').forEach(el=>{
  let sz=13,g=0;el.style.fontSize=sz+'pt';
  while(el.scrollWidth>el.clientWidth+1&&sz>8&&g++<40){sz-=.25;el.style.fontSize=sz+'pt'}
 });
}
{let q=0;const go=()=>{cancelAnimationFrame(q);q=requestAnimationFrame(fitLine)},pe=document.getElementById('e');
 new MutationObserver(go).observe(pe,{childList:true,characterData:true,subtree:true});
 if(window.ResizeObserver)new ResizeObserver(go).observe(pe);
 document.querySelectorAll('#top button').forEach(b=>b.addEventListener('click',()=>setTimeout(fitLine,0)));
 addEventListener('resize',go);
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go);
}

load();loaded=true;save();
</script>
</body>
